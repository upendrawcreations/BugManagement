server:
  port: ${SERVER_PORT:8089}
spring:
  application:
    name: bug-management
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:bug_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:rootroot}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: ${BUG_FILE_MAX_SIZE:100MB}
    max-request-size: ${BUG_REQUEST_MAX_SIZE:110MB}
app:
  jwt.secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string}
  storage.attachment-location: ${BUG_STORAGE_LOCATION:./data/bug-files}
eureka.client.service-url.defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    show-details: always
    probes.enabled: true
  metrics.tags.application: ${spring.application.name}
springdoc.swagger-ui:
  path: /swagger-ui.html
  config-url: ${SWAGGER_CONFIG_URL:/bug-management/v3/api-docs/swagger-config}
  url: ${SWAGGER_API_DOCS_URL:/bug-management/v3/api-docs}
